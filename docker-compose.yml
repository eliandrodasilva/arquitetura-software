services:
  gateway:
    build: ./microservicos/gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PRODUTOS_URL: http://produto:3001
      PEDIDOS_URL: http://pedido:3002
      CLIENTES_URL: http://cliente:3003
    depends_on:
      - produto
      - pedido
      - cliente

  produto:
    build: ./microservicos/produto
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/produtos_db
    depends_on:
      postgres:
        condition: service_healthy

  pedido:
    build: ./microservicos/pedido
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/produtos_db
      PRODUTOS_URL: http://produto:3001
      CLIENTES_URL: http://cliente:3003
    depends_on:
      postgres:
        condition: service_healthy
      produto:
        condition: service_started
      cliente:
        condition: service_started

  cliente:
    build: ./microservicos/cliente
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/produtos_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d produtos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data: